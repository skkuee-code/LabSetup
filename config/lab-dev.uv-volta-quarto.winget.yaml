# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  assertions:
    - resource: Microsoft.Windows.Developer/OsVersion
      id: os
      directives:
        description: "Windows 11 以降が前提"
        allowPrerelease: true
      settings:
        MinVersion: '10.0.22000'

  resources:
    # --- Git（GCM は Git に同梱）
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pkg_git
      directives: { description: "Git for Windows", securityContext: elevated }
      dependsOn: [ os ]
      settings:
        id: Git.Git
        source: winget
        InstallMode: Silent

    # --- Git LFS を system-wide で有効化（インストーラは使わない）
    - resource: PSDscResources/Script
      id: init_git_lfs
      directives: { description: "Initialize Git LFS system-wide", securityContext: elevated }
      dependsOn: [ os, pkg_git ]
      settings:
        GetScript: |
          function Get-GitExe {
            $candidates = @()
            try {
              $p = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p) { $candidates += (Join-Path $p 'cmd\git.exe') }
              $p32 = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p32) { $candidates += (Join-Path $p32 'cmd\git.exe') }
            } catch {}
            $candidates += @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "$env:ProgramFiles(x86)\Git\cmd\git.exe"
            )
            $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $git = Get-GitExe
          if ($git) {
            & $git lfs version 2>$null
            return @{ Git=$git; LfsOk = ($LASTEXITCODE -eq 0) }
          } else {
            return @{ Git=$null; LfsOk = $false }
          }
        TestScript: |
          function Get-GitExe {
            $candidates = @()
            try {
              $p = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p) { $candidates += (Join-Path $p 'cmd\git.exe') }
              $p32 = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p32) { $candidates += (Join-Path $p32 'cmd\git.exe') }
            } catch {}
            $candidates += @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "$env:ProgramFiles(x86)\Git\cmd\git.exe"
            )
            $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          try {
            $git = Get-GitExe
            if (-not $git) { return $false }
            & $git lfs version 2>$null
            if ($LASTEXITCODE -ne 0) { return $false }
            # LFS フィルタ設定が system に入っていれば OK
            $clean  = & $git config --system --get filter.lfs.clean  2>$null
            $smudge = & $git config --system --get filter.lfs.smudge 2>$null
            $proc   = & $git config --system --get filter.lfs.process 2>$null
            return -not [string]::IsNullOrWhiteSpace($clean+$smudge+$proc)
          } catch { return $false }
        SetScript: |
          function Get-GitExe {
            $candidates = @()
            try {
              $p = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p) { $candidates += (Join-Path $p 'cmd\git.exe') }
              $p32 = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\GitForWindows' -ErrorAction SilentlyContinue).InstallPath
              if ($p32) { $candidates += (Join-Path $p32 'cmd\git.exe') }
            } catch {}
            $candidates += @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "$env:ProgramFiles(x86)\Git\cmd\git.exe"
            )
            $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $git = Get-GitExe
          if (-not $git) { throw "git.exe not found in registry or default locations." }
          # Git for Windows 同梱の LFS を system スコープで初期化
          & $git lfs install --system
          if ($LASTEXITCODE -ne 0) { throw "git lfs install --system failed with exit code $LASTEXITCODE" }

    # --- VS Code / Slack（system 寄り）
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives: { description: "Visual Studio Code (System)", securityContext: elevated }
      settings: { id: Microsoft.VisualStudioCode, source: winget, UseLatest: true }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: slack
      directives: { description: "Slack", securityContext: elevated }
      settings: { id: SlackTechnologies.Slack, source: winget, UseLatest: true }

    # --- Python: uv（ユーザー単位）
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      directives: { description: "uv (Python manager, per-user)" }
      settings: { id: astral-sh.uv, source: winget, UseLatest: true }

    # --- Node/TypeScript: Volta（ユーザー単位）
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: volta
      directives: { description: "Volta (Node/TypeScript manager, per-user)" }
      settings: { id: Volta.Volta, source: winget, UseLatest: true }

    # --- 執筆環境：Quarto + LaTeX + Pandoc
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: miktex
      directives: { description: "MiKTeX (LaTeX)", securityContext: elevated }
      settings: { id: MiKTeX.MiKTeX, source: winget, UseLatest: true }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pandoc
      dependsOn: [ miktex ]
      directives: { description: "Pandoc", securityContext: elevated }
      settings: { id: JohnMacFarlane.Pandoc, source: winget, UseLatest: true }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: quarto
      dependsOn: [ pandoc ]
      directives: { description: "Quarto CLI", securityContext: elevated }
      settings: { id: Posit.Quarto, source: winget, UseLatest: true }

    # --- ターミナル類
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: terminal
      directives: { description: "Windows Terminal" }
      settings: { id: Microsoft.WindowsTerminal, source: winget, UseLatest: true }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pwsh
      directives: { description: "PowerShell 7", securityContext: elevated }
      settings: { id: Microsoft.PowerShell, source: winget, UseLatest: true }

  configurationVersion: 0.2.0
