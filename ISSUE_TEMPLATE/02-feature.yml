name: "✨ 機能要望 (Feature request)"
description: "新機能や改善の提案"
title: "[feat] 簡潔なタイトル"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: precheck
    attributes:
      label: 事前チェック
      options:
        - label: 同様の Issue が無いことを確認しました
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・課題
      description: なぜ必要か／誰のためか（ユーザーストーリー等）
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: 仕様の概要（UI案、API案、疑似コードでもOK）

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・関連情報
      description: 別解、既存の Issue/PR、参考リンク等

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - "P0: 直近のリリースで必要"
        - "P1: 近い将来に対応"
        - "P2: 様子見/アイデア"
      default: 1
