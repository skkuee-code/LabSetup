# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 既定は読み取り専用。必要ジョブでのみ権限を上げる
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node.js
  node:
    if: ${{ hashFiles('**/package.json') != '' }} # package.json があるときのみ実行
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # Node をセットアップ
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (if available)
        run: npm run -s lint || echo "no lint script"
      - name: Test
        run: npm test --if-present
      - name: Upload junit/coverage (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-artifacts
          path: |
            **/junit*.xml
            **/test-results/**
            **/coverage/**
          if-no-files-found: ignore

  # Python
  python:
    if: ${{ hashFiles('**/pyproject.toml', '**/requirements.txt') != '' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install pytest
      - name: Lint (ruff/flake8 if present)
        run: |
          ruff --version >/dev/null 2>&1 && ruff . || true
          flake8 --version >/dev/null 2>&1 && flake8 || true
      - name: Test
        run: pytest -q || true
      - name: Upload junit/coverage (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: |
            **/junit*.xml
            **/.pytest_cache/**
            **/coverage.xml
          if-no-files-found: ignore

  # Go
  go:
    if: ${{ hashFiles('**/go.mod') != '' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Test
        run: go test ./... -v
      - name: Upload test cache (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-artifacts
          path: |
            **/test-results/**
          if-no-files-found: ignore
  # Java (Maven)
  java:
    if: ${{ hashFiles('**/pom.xml') != '' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build & Test
        run: mvn -B -ntp -DskipTests=false verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-artifacts
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
          if-no-files-found: ignore

  # Rust
  rust:
    if: ${{ hashFiles('**/Cargo.toml') != '' }}
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all --verbose
      - name: Upload artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-artifacts
          path: |
            target/debug/deps/**
          if-no-files-found: ignore
