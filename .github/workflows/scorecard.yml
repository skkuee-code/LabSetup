# .github/workflows/scorecard.yml
name: Scorecards supply-chain security
on:
  schedule:
    - cron: '0 0 * * *' # 毎日
  push:
    branches: [ main ]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Code scanning ダッシュボードにアップロードする場合
      id-token: write          # publish_results に必要
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # OSS 公開リポジトリでバッジ公開したいとき
      - name: Upload SARIF
        uses: actions/upload-artifact@v6
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
